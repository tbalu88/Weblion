# Crazy 360 – natív iPhone-app a 360-as platformhoz (XcodeGen-leírás).
# A projektet a CI generálja: `brew install xcodegen && cd ios && xcodegen generate` → Crazy360.xcodeproj
name: Crazy360
options:
  bundleIdPrefix: hu.eventcrazy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: hu

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Swift: 6.2+ fordító, egyelőre Swift 5 nyelvi mód teljes ellenőrzéssel (a concurrency-hibák figyelmeztetésként
    # látszanak). Approachable Concurrency + alapból MainActor; a nehéz munka @concurrent függvényekben fut.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  SpinKit:
    path: SpinKit

targets:
  Crazy360:
    type: application
    platform: iOS
    sources:
      - path: Crazy360
    dependencies:
      - package: SpinKit
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Crazy 360
        CFBundleDevelopmentRegion: hu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
          UIImageRespectsSafeAreaInsets: true
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: A 360-as videók felvételéhez kell a kamera.
        NSPhotoLibraryAddUsageDescription: A kész videókat – ha bekapcsolod – a Fotók alkalmazásba is mentjük.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hu.eventcrazy.crazy360
        PRODUCT_NAME: Crazy360
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic

  Crazy360Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Crazy360Tests
    dependencies:
      - target: Crazy360
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hu.eventcrazy.crazy360.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Crazy360:
    build:
      targets:
        Crazy360: all
        Crazy360Tests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - Crazy360Tests
    archive:
      config: Release
