# Crazy Booth Windows-csomag nyilvános letöltési linkkel (GitHub Release).
# Indul: „[booth-release]” szót tartalmazó commitnál. A link: .../releases/download/booth-v<verzió>/CrazyBooth-<verzió>-Windows-x64.zip
name: Crazy Booth – Windows-kiadás

on:
  push:
    paths:
      - 'booth/**'
      - '.github/workflows/booth-release.yml'

permissions:
  contents: write

jobs:
  # 0.18.0: a digiCamControl (MIT) beépítése – Windows-gépen csendben telepítjük, a programmappáját a csomagba tesszük
  dcc:
    if: contains(github.event.head_commit.message, '[booth-release]')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: booth/cbcam
      - name: digiCamControl 2.1.7.0 letöltése és telepítése
        shell: pwsh
        run: |
          curl.exe -sSL --retry 4 -o setup.exe "https://sourceforge.net/projects/digicamcontrol/files/digiCamControlsetup_2.1.7.0.exe/download"
          $h = (Get-FileHash setup.exe -Algorithm SHA256).Hash.ToLower()
          if ($h -ne 'e1f47e28c5073fe190a77353af1496508cdce48f7390f516c666ad1ba365aecf') { throw "Hibás ellenőrzőösszeg: $h" }
          $p = Start-Process .\setup.exe -ArgumentList '/quiet','/norestart' -Wait -PassThru
          "telepítő kilépési kód: $($p.ExitCode)"
          $d = @("$env:ProgramFiles\digiCamControl", "${env:ProgramFiles(x86)}\digiCamControl") | Where-Object { Test-Path "$_\CameraControl.exe" } | Select-Object -First 1
          if (-not $d) { Get-ChildItem $env:ProgramFiles, ${env:ProgramFiles(x86)} | Out-String | Write-Host; throw 'Nincs CameraControl.exe' }
          New-Item -ItemType Directory dcc | Out-Null
          Copy-Item "$d\*" dcc -Recurse
          curl.exe -sSL --retry 4 -o dcc\LICENSE-digiCamControl.txt "https://raw.githubusercontent.com/dukus/digiCamControl/master/LICENSE"
          "méret: {0:N0} MB" -f ((Get-ChildItem dcc -Recurse | Measure-Object Length -Sum).Sum / 1MB)
          Get-ChildItem dcc -Filter *.exe | Select-Object Name | Out-String | Write-Host
      # 0.19.0: ablak nélküli kamerakezelő (cbcam.exe) a digiCamControl kamerakönyvtárával – ha nem fordul, a régi út marad
      - name: cbcam.exe fordítása
        shell: pwsh
        continue-on-error: true
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          $fw = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319"
          $refs = @("$fw\System.dll", "$fw\System.Core.dll", "$fw\WPF\WindowsBase.dll", "dcc\CameraControl.Devices.dll")
          Get-ChildItem dcc -Filter *.dll | Where-Object { $_.Name -match '^(PortableDeviceLib|Canon\.Eos\.Framework|log4net)' } | ForEach-Object { $refs += $_.FullName }
          $r = ($refs | ForEach-Object { "/r:$_" })
          & $csc /nologo /platform:x86 /target:exe /optimize+ /out:dcc\cbcam.exe $r booth\cbcam\cbcam.cs
          if ($LASTEXITCODE -ne 0) { throw "a cbcam nem fordult le" }
          if (Test-Path dcc\CameraControl.exe.config) { Copy-Item dcc\CameraControl.exe.config dcc\cbcam.exe.config }
          Get-Item dcc\cbcam.exe | Select-Object Name, Length | Out-String | Write-Host
      - uses: actions/upload-artifact@v4
        with:
          name: dcc
          path: dcc
          retention-days: 3

  windows-zip:
    needs: dcc
    if: contains(github.event.head_commit.message, '[booth-release]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: dcc
          path: booth/vendor/dcc
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Csomagolás (Windows x64 zip)
        working-directory: booth
        run: |
          npm ci
          npx electron-builder --win zip --x64 --publish never
          VER=$(node -p "require('./package.json').version")
          SRC=$(ls dist/*win*.zip dist/*.zip 2>/dev/null | grep -i -v mac | head -1)
          mkdir -p ../release && cp "$SRC" "../release/CrazyBooth-$VER-Windows-x64.zip"
          # 0.18.3: kis frissítés – csak a programkód (app.asar, ~3 MB) és az adatai; a frissítő ezt tölti le, ha a motor nem változott
          ASAR=$(ls dist/win-unpacked/resources/app.asar)
          (cd "$(dirname "$ASAR")" && zip -9 -q "$GITHUB_WORKSPACE/release/CrazyBooth-$VER-app.zip" app.asar)
          # 0.19.0: a kis csomagban a saját kamerakezelő (cbcam.exe, néhány kB) is benne van
          (cd "$(dirname "$ASAR")" && for f in dcc/cbcam.exe dcc/cbcam.exe.config; do [ -f "$f" ] && zip -9 -q "$GITHUB_WORKSPACE/release/CrazyBooth-$VER-app.zip" "$f"; done; true)
          unzip -l "../release/CrazyBooth-$VER-app.zip"
          EV=$(node -p "require('electron/package.json').version")
          SHA=$(sha256sum "../release/CrazyBooth-$VER-app.zip" | cut -c1-64)
          printf '{"v":"%s","electron":"%s","sha256":"%s","dcc":true}\n' "$VER" "$EV" "$SHA" > "../release/CrazyBooth-$VER-app.json"
          cat "../release/CrazyBooth-$VER-app.json"
          echo "VER=$VER" >> "$GITHUB_ENV"
          ls -la ../release
      - name: Kiadás (nyilvános letöltés)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="booth-v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "release/CrazyBooth-$VER-Windows-x64.zip" "release/CrazyBooth-$VER-app.zip" "release/CrazyBooth-$VER-app.json" --clobber
          else
            gh release create "$TAG" "release/CrazyBooth-$VER-Windows-x64.zip" "release/CrazyBooth-$VER-app.zip" "release/CrazyBooth-$VER-app.json" --target "$GITHUB_SHA" \
              --title "Crazy Booth $VER (Windows)" \
              --notes "Kicsomagolás után a Crazy Booth.exe indítja. Telepítés nem kell."
          fi
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/CrazyBooth-$VER-Windows-x64.zip"

  mac-zip:
    needs: windows-zip
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Csomagolás (Mac, Apple Silicon zip)
        working-directory: booth
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npx electron-builder --mac zip --arm64 --publish never || true
          VER=$(node -p "require('./package.json').version")
          SRC=$(ls dist/*.zip | grep -i -v win | head -1)
          [ -n "$SRC" ] || { echo "nincs Mac zip"; exit 1; }
          mkdir -p ../release && cp "$SRC" "../release/CrazyBooth-$VER-Mac-AppleSilicon.zip"
          echo "VER=$VER" >> "$GITHUB_ENV"
      - name: Feltöltés a kiadáshoz
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "booth-v$VER" "release/CrazyBooth-$VER-Mac-AppleSilicon.zip" --clobber
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/booth-v$VER/CrazyBooth-$VER-Mac-AppleSilicon.zip"
